# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): compile the net48 add-in against the documentation-derived stubs (Microsoft.NETFramework.ReferenceAssemblies), then the seat-free net8.0 smoke tests, on Linux x64.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  # mcr.microsoft.com/dotnet/sdk:8.0 (SDK 8.0.427) manifest list, pinned. The add-in is
  # PlatformTarget x64, so the tests need an x64 runtime: the engine VMs are linux/amd64.
  - name: stub-build
    image: bash
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 container-run --src=. --repo="$${CI_REPO_NAME,,}"
        --image=mcr.microsoft.com/dotnet/sdk:8.0@sha256:341aa6e8bbaceb1194732328ca27c15bfa9c531687db83a66af3c0c1833f5534
        --shell=bash --env=DOTNET_CLI_TELEMETRY_OPTOUT=1 --env=DOTNET_NOLOGO=1
        --run='dotnet build src/PhiMech.SolidWorks/PhiMech.SolidWorks.csproj --configuration Release --nologo
        && dotnet test tests/PhiMech.SolidWorks.Tests/PhiMech.SolidWorks.Tests.csproj --configuration Release --nologo'
        --test-workers=2
